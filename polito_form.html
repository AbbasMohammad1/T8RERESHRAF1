<style>
* { margin:0; padding:0; box-sizing:border-box; }
.wrap { background:#0a0010; min-height:100vh; padding:24px; font-family:sans-serif; direction:rtl; }
.header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid #2d0a50; }
.header img { width:70px; height:70px; object-fit:contain; }
.header-title h1 { font-size:20px; font-weight:500; color:#c084fc; text-align:center; }
.header-title p { font-size:12px; color:#6040a0; margin-top:4px; text-align:center; }
.tabs { display:flex; gap:8px; margin-bottom:20px; }
.tab { flex:1; padding:10px; border-radius:8px; border:1px solid #3d1a60; background:#110022; color:#8060a0; font-size:14px; cursor:pointer; text-align:center; transition:all 0.2s; }
.tab.active { background:#7c3aed; color:#fff; border-color:#7c3aed; }
.page { display:none; }
.page.active { display:block; }
.card { background:#110022; border:1px solid #2d0a50; border-radius:12px; padding:18px; margin-bottom:14px; }
.section-label { font-size:11px; color:#7c3aed; font-weight:500; letter-spacing:1px; margin-bottom:12px; }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
.field label { font-size:12px; color:#a07cc0; display:block; margin-bottom:5px; }
.field input { width:100%; background:#1a0030; border:1px solid #3d1a60; color:#e0d0ff; padding:8px 10px; border-radius:7px; font-size:13px; direction:ltr; text-align:right; outline:none; }
.field input:focus { border-color:#7c3aed; }
.field input::placeholder { color:#4a2a6a; font-size:12px; }
.hint { font-size:10px; margin-top:3px; min-height:14px; }
.hint.ok { color:#6ee7b7; }
.hint.info { color:#4a2a6a; }
.time-wrap { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.period-wrap { display:flex; gap:10px; margin-top:6px; align-items:center; }
.period-wrap label { display:flex; align-items:center; gap:4px; color:#8060a0; font-size:12px; cursor:pointer; }
.rep-num-wrap { text-align:center; margin-bottom:18px; }
.rep-num-wrap input { background:#0a0010; border:none; border-bottom:2px solid #7c3aed; color:#c084fc; font-size:32px; font-weight:500; text-align:center; width:90px; outline:none; direction:ltr; }
.btn-primary { width:100%; margin-top:16px; background:#7c3aed; color:#fff; border:none; padding:12px; border-radius:10px; font-size:14px; cursor:pointer; }
.btn-primary:hover { background:#6d28d9; }
#output { display:none; margin-top:20px; }
#report-text { width:100%; background:#0a0010; border:1px solid #3d1a60; color:#d4b8f0; padding:12px; border-radius:8px; font-size:13px; line-height:1.9; direction:rtl; resize:none; min-height:380px; }
.copy-btn { margin-top:10px; width:100%; background:transparent; border:1px solid #5a2d8a; color:#c084fc; padding:10px; border-radius:8px; font-size:14px; cursor:pointer; }
.members-list { margin-top:12px; }
.member-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:center; padding:8px 0; border-bottom:1px solid #1a0030; }
.member-row:last-child { border-bottom:none; }
.member-code { color:#c084fc; font-size:13px; font-weight:500; }
.member-id { color:#6040a0; font-size:12px; direction:ltr; text-align:left; }
.del-btn { background:transparent; border:1px solid #5a1a1a; color:#f87171; padding:4px 10px; border-radius:6px; font-size:12px; cursor:pointer; }
.add-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; align-items:end; margin-top:12px; }
.add-row input { width:100%; background:#1a0030; border:1px solid #3d1a60; color:#e0d0ff; padding:8px 10px; border-radius:7px; font-size:13px; outline:none; direction:ltr; }
.add-row input:focus { border-color:#7c3aed; }
.add-btn { background:#7c3aed; color:#fff; border:none; padding:9px 16px; border-radius:7px; font-size:13px; cursor:pointer; white-space:nowrap; }
.empty-msg { color:#4a2a6a; font-size:13px; text-align:center; padding:16px 0; }
</style>

<script>












function resolve(val) {
  if (!val || !val.trim()) return 'لا يوجد';
  return '@' + val.trim().toUpperCase();
}

function showPreview(input) {
  var preview = document.getElementById('preview-' + input.id);
  if (!preview) return;
  var code = input.value.trim().toUpperCase();
  if (!code) { preview.innerHTML = ''; return; }
  preview.textContent = '@' + code;
  preview.className = 'hint ok';
}



function val(id) { 
  var el = document.getElementById(id); 
  return resolve(el ? el.value : ''); 
}

function generateReport() { try {
  var num = document.getElementById('rep-num').value || '00';
  var tf = document.getElementById('time-from').value;
  var tt = document.getElementById('time-to').value;
  var pf = document.getElementById('period-from').value;
  var pt = document.getElementById('period-to').value;
